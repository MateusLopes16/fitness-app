<div class="container">
  <!-- Login Form -->
  <div class="auth-header">
    <h2 class="title">Welcome Back</h2>
    <p class="subtitle">Sign in to continue your fitness journey</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="card-base">

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" class="input"
        [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" formControlName="password" class="input"
        [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        placeholder="Enter your password" />
    </div>

    <div class="error-message" *ngIf="errorMessage()">
      {{ errorMessage() }}
    </div>

    <button type="submit" class="btn-full" [disabled]="loginForm.invalid || isLoading()">
      <span *ngIf="!isLoading()">Sign In</span>
      <span *ngIf="isLoading()">Signing in...</span>
    </button>
  </form>

  <!-- Footer with register link -->
  <div class="auth-footer">
    <p>Don't have an account?
      <button class="link-button" (click)="navigateToRegister()">
        Create account
      </button>
    </p>
  </div>
</div>
