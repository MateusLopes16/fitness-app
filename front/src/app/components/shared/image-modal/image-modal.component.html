<div class="modal-overlay" 
     *ngIf="isVisible" 
     (click)="onBackdropClick($event)">
  <div class="modal-content">
    <button class="close-button" (click)="closeModal()" aria-label="Close image">
      ✕
    </button>
    <div class="image-container">
      <img [src]="imageUrl" 
           [alt]="altText" 
           (error)="onImageError($event)"
           class="modal-image">
    </div>
  </div>
</div>
