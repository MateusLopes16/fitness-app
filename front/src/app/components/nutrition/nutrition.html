<div class="container">
    <div class="nutrition-header">
        <h1 class="title">Nutrition Management</h1>
        <p class="subtitle">Manage your meals, ingredients, and track your daily nutrition</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="nutrition-tabs card-base">
        <button class="btn-ghost" [class.active]="activeTab() === 'ingredients'" (click)="activeTab.set('ingredients')">
            🥕 Ingredients
        </button>
        <button class="btn-ghost" [class.active]="activeTab() === 'meals'" (click)="activeTab.set('meals')">
            🍽️ Meals
        </button>
        <button class="btn-ghost" [class.active]="activeTab() === 'scheduling'" (click)="activeTab.set('scheduling')">
            📅 Planning
        </button>
    </div>

    <app-ingredients-tab *ngIf="activeTab() === 'ingredients'"></app-ingredients-tab>

  </div>

  <div *ngIf="activeTab() === 'scheduling'" class="tab-content">

</div>
