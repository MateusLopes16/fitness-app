<div class="container">
    <div class="page-header">
        <h1 class="title">{{ isEditing() ? 'Edit' : 'Add' }} Ingredient</h1>
        <button class="btn-ghost" (click)="onCancel()">
            <span>←</span>
            Back to Nutrition
        </button>
    </div>

    <!-- Error Display -->
    <div class="error-message animate-shake" *ngIf="error()">
        <span class="error-icon">⚠️</span>
        {{ error() }}
    </div>

    <!-- Form -->
    <div class="form-container" *ngIf="!loading() || !isEditing()">
        <form (ngSubmit)="onSave()" class="ingredient-form">
            <!-- Nutritional Information -->
            <div class="form-section">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" [value]="ingredient().name"
                        (input)="updateIngredient('name', ($any($event.target)).value)"
                        placeholder="e.g., Chicken Breast" required class="input">
                </div>
                <div class="form-group">
                    <label for="imageUrl">Image URL</label>
                    <input type="url" id="imageUrl" [value]="ingredient().imageUrl || ''"
                        (input)="updateIngredient('imageUrl', ($any($event.target)).value)"
                        placeholder="https://example.com/image.jpg" class="input">
                </div>
                <div class="form-group">
                    <label for="calories">Calories</label>
                    <input type="number" id="calories" [value]="ingredient().caloriesPer100g"
                        (input)="updateIngredient('caloriesPer100g', ($any($event.target)).value)" min="0" step="0.1"
                        required class="input" placeholder="0">
                </div>
            </div>
            <div class="form-section">


                <div class="form-group">
                    <label for="protein">Protein (g)</label>
                    <input type="number" id="protein" [value]="ingredient().proteinPer100g"
                        (input)="updateIngredient('proteinPer100g', ($any($event.target)).value)" min="0" step="0.1"
                        required class="input" placeholder="0.0">
                </div>

                <div class="form-group">
                    <label for="carbs">Carbs (g)</label>
                    <input type="number" id="carbs" [value]="ingredient().carbsPer100g"
                        (input)="updateIngredient('carbsPer100g', ($any($event.target)).value)" min="0" step="0.1"
                        required class="input" placeholder="0.0">
                </div>

                <div class="form-group">
                    <label for="fat">Fat (g)</label>
                    <input type="number" id="fat" [value]="ingredient().fatPer100g"
                        (input)="updateIngredient('fatPer100g', ($any($event.target)).value)" min="0" step="0.1"
                        required class="input" placeholder="0.0">
                </div>
            </div>
            <div class="form-section">
                <div class="form-group">
                    <label for="fiber">Fiber (g)</label>
                    <input type="number" id="fiber" [value]="ingredient().fiberPer100g || ''"
                        (input)="updateIngredient('fiberPer100g', ($any($event.target)).value || undefined)" min="0"
                        step="0.1" class="input" placeholder="0.0">
                </div>

                <div class="form-group">
                    <label for="sugar">Sugar (g)</label>
                    <input type="number" id="sugar" [value]="ingredient().sugarPer100g || ''"
                        (input)="updateIngredient('sugarPer100g', ($any($event.target)).value || undefined)" min="0"
                        step="0.1" class="input" placeholder="0.0">
                </div>

                <div class="form-group">
                    <label for="sodium">Sodium (mg)</label>
                    <input type="number" id="sodium" [value]="ingredient().sodiumPer100g || ''"
                        (input)="updateIngredient('sodiumPer100g', ($any($event.target)).value || undefined)" min="0"
                        step="0.1" class="input" placeholder="0.0">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-full" [disabled]="loading() || !isFormValid()">
                    {{ loading() ? 'Saving...' : (isEditing() ? 'Update' : 'Add') }} Ingredient
                </button>

                <button type="button" class="btn-full red" (click)="onCancel()" [disabled]="loading()">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
