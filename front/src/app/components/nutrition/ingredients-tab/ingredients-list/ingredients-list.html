<div class="ingredients-list-header">

    <div class="search">
        <input type="text" class="input" placeholder="🔍 Search ingredients..." [value]="ingredientSearch()"
            (input)="onSearchChange(($any($event.target)).value)" />
    </div>

    <div class="filters">
        <div class="filter-item">Protein</div>
        <div class="filter-item">Carbs</div>
        <div class="filter-item">Fat</div>
        <div class="filter-item">Fiber</div>
    </div>
    <div class="header-actions">
        <button class="btn-ghost" (click)="onAddNew()">➕</button>
        <div class="view-switch">
            <button class="btn-ghost view-toggle" (click)="chooseView('grid')" [class.active]="viewType() === 'grid'">⚏</button>
            <button class="btn-ghost view-toggle" (click)="chooseView('list')" [class.active]="viewType() === 'list'">☰</button>
        </div>
    </div>
</div>

<!-- Loading state -->
<div class="loading-state" *ngIf="loading()">
    <h3 class="subtitle">Loading ingredients...</h3>
    <p class="subtitle">Please wait while we fetch your ingredients.</p>
</div>

<!-- Empty state -->
<div class="empty-state animate-empty-state-bounce" *ngIf="showEmptyState()">
    <h3 class="subtitle">🥗 No ingredients found</h3>
</div>

<!-- Ingredients list -->
<div class="ingredients-container" *ngIf="hasIngredients()">
    <div [class.ingredients-list]="viewType() === 'list'" [class.ingredients-grid]="viewType() === 'grid'">
        <!-- Ingredient rows -->
        <app-ingredient-item *ngFor="let ingredient of filteredIngredientsComputed(); trackBy: trackByIngredientId"
            [ingredient]="ingredient" [quantityGrams]="getDisplayQuantity(ingredient)" (deleteIngredient)="onDelete($event)"
            (selectedIngredient)="onIngredientSelected($event)" [showActions]="showActions" [viewType]="viewType()">
        </app-ingredient-item>
    </div>
</div>
