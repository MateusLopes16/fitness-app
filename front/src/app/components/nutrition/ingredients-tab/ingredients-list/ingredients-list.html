<!-- Loading state -->
<div class="loading-state" *ngIf="loading()">
    <h3 class="subtitle">Loading ingredients...</h3>
    <p class="subtitle">Please wait while we fetch your ingredients.</p>
</div>

<!-- Empty state -->
<div class="empty-state animate-empty-state-bounce" *ngIf="showEmptyState()">
    <h3 class="subtitle">🥗 No ingredients found</h3>
    <p class="subtitle">Start by adding your first ingredient to build your nutrition database.</p>
    <button class="btn-full" (click)="onAddNew()">
        Add Your First Ingredient
    </button>
</div>

<!-- Ingredients list -->
<div class="ingredients-list" *ngIf="hasIngredients()">
    <div class="list-header">
        <div class="filters">
            <div class="filter-item">Breakfast</div>
            <div class="filter-item">Lunch</div>
            <div class="filter-item">Dinner</div>
            <div class="filter-item">Snacks</div>
        </div>
        <div class="view-switch">
            <button class="btn-ghost" (click)="chooseView('list')">list</button>
            <button class="btn-ghost" (click)="chooseView('grid')">grid</button>
        </div>
    </div>
    <!-- Ingredient rows -->
    <app-ingredient-item *ngFor="let ingredient of ingredients(); trackBy: trackByIngredientId"
        [ingredient]="ingredient" [quantityGrams]="getDisplayQuantity(ingredient)" (deleteIngredient)="onDelete($event)"
        (selectedIngredient)="onIngredientSelected($event)" [showActions]="showActions" [viewType]="viewType()">
    </app-ingredient-item>
</div>
