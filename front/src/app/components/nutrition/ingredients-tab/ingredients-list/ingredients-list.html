<!-- Loading state -->
<div class="loading-state" *ngIf="loading()">
    <h3 class="subtitle">Loading ingredients...</h3>
    <p class="subtitle">Please wait while we fetch your ingredients.</p>
</div>

<!-- Empty state -->
<div class="empty-state animate-empty-state-bounce" *ngIf="showEmptyState()">
    <h3 class="subtitle">🥗 No ingredients found</h3>
    <p class="subtitle">Start by adding your first ingredient to build your nutrition database.</p>
    <button class="btn-full" (click)="onAddNew()">
        Add Your First Ingredient
    </button>
</div>

<!-- Ingredients list -->
<div class="ingredients-list" *ngIf="hasIngredients()">
    <!-- Ingredient rows -->
    <app-ingredient-item *ngFor="let ingredient of ingredients(); trackBy: trackByIngredientId"
        [ingredient]="ingredient" 
        [quantityGrams]="getDisplayQuantity(ingredient)"
        (deleteIngredient)="onDelete($event)"
        (selectedIngredient)="onIngredientSelected($event)"
        [showActions]="showActions">
    </app-ingredient-item>
</div>
