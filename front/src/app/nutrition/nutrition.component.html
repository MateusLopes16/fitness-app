<div class="container">
  <div class="nutrition-header">
    <h1 class="title">Nutrition Management</h1>
    <p class="subtitle">Manage your meals, ingredients, and track your daily nutrition</p>
  </div>

  <!-- Navigation Tabs -->
  <div class="nutrition-tabs card-base">
    <button class="btn-ghost" 
            [class.active]="activeTab() === 'meals'"
            (click)="activeTab.set('meals')">
      🍽️ Meals
    </button>
    <button class="btn-ghost" 
            [class.active]="activeTab() === 'ingredients'"
            (click)="activeTab.set('ingredients')">
      🥕 Ingredients
    </button>
    <button class="btn-ghost" 
            [class.active]="activeTab() === 'scheduling'"
            (click)="activeTab.set('scheduling')">
      📅 Planning
    </button>
  </div>

  <!-- Error Message -->
  <div class="error-message" *ngIf="error()">
    <span class="error-icon">⚠️</span>
    {{ error() }}
    <button class="close-error" (click)="error.set('')">×</button>
  </div>

  <!-- Meals Tab -->
  <div *ngIf="activeTab() === 'meals'" class="tab-content">
    <app-meals-list
      [meals]="meals()"
      [loading]="loading()"
      (duplicateMeal)="onDuplicateMeal($event)"
      (deleteMeal)="onDeleteMeal($event)"
    ></app-meals-list>
  </div>

  <!-- Ingredients Tab -->
  <div *ngIf="activeTab() === 'ingredients'" class="tab-content">
    <app-ingredients-list
      [ingredients]="ingredients()"
      [loading]="loading()"
      (deleteIngredient)="onDeleteIngredient($event)"
    ></app-ingredients-list>
  </div>

  <!-- Meal Scheduling Tab -->
  <div *ngIf="activeTab() === 'scheduling'" class="tab-content">
    <app-meal-scheduling></app-meal-scheduling>
  </div>

  <!-- Meal Form Modal -->
  <app-meal-form
    *ngIf="showMealForm()"
    [editingMeal]="editingMeal()"
    [loading]="loading()"
    (close)="closeMealForm()"
    (save)="onSaveMeal($event)"
  ></app-meal-form>
</div>
