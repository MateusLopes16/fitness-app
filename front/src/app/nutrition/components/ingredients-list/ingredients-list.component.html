<div class="container">
  <!-- Header -->
  <div class="list-header">
    <h2 class="subtitle">Your Ingredients ({{ ingredients.length }})</h2>
    <button class="btn-full" (click)="onAddNew()" [disabled]="loading">
      <span class="btn-icon">➕</span>
      Add Ingredient
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="loading">
    <div class="loading-spinner animate-spin"></div>
    <p>Loading ingredients...</p>
  </div>

  <!-- Ingredients List -->
  <div class="ingredients-list" *ngIf="!loading && ingredients.length > 0">
    <!-- Ingredient rows -->
    <app-ingredient-item *ngFor="let ingredient of ingredients; trackBy: trackByIngredientId" [ingredient]="ingredient"
      (edit)="onEdit($event)" (delete)="onDelete($event)" class="animate-ingredient-slide-in">
    </app-ingredient-item>
  </div>
  

  <!-- Empty State -->
  <div class="empty-state animate-empty-state-bounce" *ngIf="!loading && ingredients.length === 0">
    <div class="empty-icon">🥗</div>
    <h3>No ingredients found</h3>
    <p>Start by adding your first ingredient to build your nutrition database.</p>
    <button class="btn btn-primary" (click)="onAddNew()">
      Add Your First Ingredient
    </button>
  </div>
</div>
