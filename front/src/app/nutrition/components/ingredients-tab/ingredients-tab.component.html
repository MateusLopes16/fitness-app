<div class="container">
  <!-- Header -->
  <div class="list-header">
    <h2 class="subtitle">Your Ingredients ({{ ingredients.length }})</h2>
    <button class="btn-full" (click)="onAddNew()" [disabled]="loading">
      <span class="btn-icon">➕</span>
      Add Ingredient
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="loading">
    <div class="loading-spinner animate-spin"></div>
    <p>Loading ingredients...</p>
  </div>


  <div class="column-details">
    <div class="ingredient-item card-blur">
      <div class="col-name truncate">
        <span class="creator-badge">
          👑
        </span>
        <span class="ingredient-name">Name</span>
      </div>

      <div class="ingredient-value col-calories">
        <span class="value">Calories</span>
      </div>

      <div class="ingredient-value col-protein">
        <span class="value">Protein</span>
      </div>

      <div class="ingredient-value col-carbs">
        <span class="value">Carbs</span>
      </div>

      <div class="ingredient-value col-fat">
        <span class="value">Fat</span>
      </div>

      <div class="ingredient-value col-fiber">
        <span class="value">Fiber</span>
      </div>
    </div>
  </div>
  <app-ingredients-list [ingredients]="ingredients" [loading]="loading"
    (deleteIngredient)="onDelete($event)"></app-ingredients-list>

  <!-- Empty State -->
  <div class="empty-state animate-empty-state-bounce" *ngIf="!loading && ingredients.length === 0">
    <div class="empty-icon">🥗</div>
    <h3>No ingredients found</h3>
    <p>Start by adding your first ingredient to build your nutrition database.</p>
    <button class="btn btn-primary" (click)="onAddNew()">
      Add Your First Ingredient
    </button>
  </div>
</div>
