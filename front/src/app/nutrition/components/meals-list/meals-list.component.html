<div class="container">
  <div class="list-header">
    <h2 class="subtitle">🍽️ Your Meals</h2>
    <button class="btn-full" (click)="onAddNew()">
      <span class="icon">➕</span>
      Add Meal
    </button>
  </div>

  <!-- <div class="loading-state" *ngIf="loading">
    <div class="loading-spinner animate-spin"></div>
    <p>Loading ingredients...</p>
  </div> -->

  <div class="meals-grid" *ngIf="!loading();">
    <div *ngIf="filteredMeals().length === 0" class="empty-state">
      <div class="empty-icon">🍽️</div>
      <h3>No meals found</h3>
      <p>Add your first meal to track your nutrition</p>
      <button class="btn-primary" (click)="onAddNew()">
        Add Meal
      </button>
    </div>

    <app-meal-item *ngFor="let meal of filteredMeals()" [meal]="meal" (view)="onView($event)" (edit)="onEdit($event)"
      (duplicate)="duplicateMeal.emit($event)" (delete)="deleteMeal.emit($event)">
    </app-meal-item>
  </div>

</div>
