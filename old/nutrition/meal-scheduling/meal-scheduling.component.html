<div class="container">
  <!-- Header -->
  <div class="scheduling-header">
    <h2 class="subtitle">📅 Meal Scheduling</h2>
    <div class="view-toggle">
      <button class="btn-full" [class.active]="viewMode() === 'daily'" (click)="switchViewMode('daily')">
        📅 Daily
      </button>
      <button class="btn-full" [class.active]="viewMode() === 'weekly'" (click)="switchViewMode('weekly')">
        📊 Weekly
      </button>
    </div>
  </div>

  <app-weekly-scheduling class="weekly-view" *ngIf="viewMode() === 'weekly'"></app-weekly-scheduling>
  <app-daily-scheduling class="daily-view" *ngIf="viewMode() === 'daily'"></app-daily-scheduling>
</div>
